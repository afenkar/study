<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 50 · Mock 数据演示</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    h1 { font-size: 1.25rem; }
    section { margin: 1.5rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
    button { margin-right: 0.5rem; margin-bottom: 0.5rem; padding: 0.45rem 0.9rem; cursor: pointer; }
    .hint { color: #666; font-size: 0.9rem; }
    .status { font-weight: 600; min-height: 1.5em; }
    ul { padding-left: 1.25rem; }
    li { margin: 0.35rem 0; }
    code { background: #f0f0f0; padding: 0.1em 0.3em; border-radius: 3px; }
    .tag { display: inline-block; font-size: 0.8rem; padding: 0.1em 0.45em; border-radius: 4px; background: #e8f4ff; }
  </style>
</head>
<body>
  <h1>Day 50 · Mock 数据 · 实验 A</h1>
  <p class="hint">须用 <strong>Live Server</strong> 打开。F12 → Network 看请求的是本地 JSON，不是真实后端。</p>

  <section>
    <h2>模拟接口</h2>
    <button id="btn-ok">加载用户列表（正常 Mock）</button>
    <button id="btn-empty">模拟 401 未登录</button>
    <p class="status" id="status"></p>
    <ul id="list"></ul>
  </section>

  <section>
    <h2>说明</h2>
    <p>正常数据来自 <code>data/users.json</code>；401 来自 <code>data/users-empty.json</code>（结构对齐真 API：<code>code</code> / <code>message</code> / <code>data</code>）。</p>
    <p>可改 JSON 里名字后重新点按钮，观察列表变化——这就是 Mock 的好处。</p>
  </section>

  <script type="module" src="demo.js"></script>
</body>
</html>

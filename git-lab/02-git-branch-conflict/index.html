<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }

    .diagram { background: #fafafa; padding: 1rem; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 0.85rem; white-space: pre-wrap; }
    .q { margin: 1rem 0; }
    .q label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    select { width: 100%; max-width: 420px; padding: 0.35rem; min-height: 2.2rem; }

    button { margin-top: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
    .output { margin-top: 1rem; font-weight: 600; min-height: 1.5em; }

<body>

  <section>
    <h2>冲突标记示意</h2>
    <pre class="diagram">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD
当前分支的内容

&gt;&gt;&gt;&gt;&gt;&gt;&gt; feat/xxx</pre>

      <select id="q1"></select>
    </div>

    <div class="q">
      <label>2. <<<<<<< HEAD 和 ======= 之间是？</label>
      <select id="q2"></select>
    </div>

    <div class="q">
      <label>3. 解决冲突第一步？</label>
      <select id="q3"></select>
    </div>

    <div class="q">
      <label>4. 改完冲突文件后？</label>
      <select id="q4"></select>
    </div>

    <div class="q">
      <label>5. git merge --abort 干什么？</label>
      <select id="q5"></select>
    </div>

    <div class="q">
      <label>6. git pull 报冲突说明？</label>
      <select id="q6"></select>
    </div>

    <div class="q">

    <div class="q">

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第 9 周复盘 · Day 33 自测</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    h1 { font-size: 1.25rem; }
    section { margin: 1.5rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
    .q { margin: 1rem 0; }
    .q label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    select { width: 100%; max-width: 420px; padding: 0.35rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
    .output { margin-top: 1rem; font-weight: 600; min-height: 1.5em; }
    .hint { color: #666; font-size: 0.9rem; }
    code { background: #f0f0f0; padding: 0.1em 0.3em; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>第 9 周复盘 · 闭卷自测（10 题）</h1>
  <p class="hint">覆盖 Day 32 composable + 与 Pinia/ref 对比。对照 <code>notes/week09-day33-week9-review.md</code>。</p>

  <section>
    <div class="q">
      <label>1. composable 函数命名惯例？</label>
      <select id="q1">
        <option value="">请选择</option>
        <option value="use">use 开头</option>
        <option value="create">create 开头</option>
      </select>
    </div>

    <div class="q">
      <label>2. composable 主要解决？</label>
      <select id="q2">
        <option value="">请选择</option>
        <option value="reuse">复用响应式逻辑</option>
        <option value="global">全局共享状态</option>
      </select>
    </div>

    <div class="q">
      <label>3. composable 里能用 ref 吗？</label>
      <select id="q3">
        <option value="">请选择</option>
        <option value="yes">能</option>
        <option value="no">不能</option>
      </select>
    </div>

    <div class="q">
      <label>4. 跨页面共享登录用户，优先？</label>
      <select id="q4">
        <option value="">请选择</option>
        <option value="pinia">Pinia</option>
        <option value="composable">composable</option>
      </select>
    </div>

    <div class="q">
      <label>5. 封装 useFetch 请求逻辑，适合？</label>
      <select id="q5">
        <option value="">请选择</option>
        <option value="composable">composable</option>
        <option value="slot">slot</option>
      </select>
    </div>

    <div class="q">
      <label>6. 单个组件内临时 UI 状态，优先？</label>
      <select id="q6">
        <option value="">请选择</option>
        <option value="ref">ref / reactive</option>
        <option value="pinia">Pinia</option>
      </select>
    </div>

    <div class="q">
      <label>7. composable 里读 ref，要？</label>
      <select id="q7">
        <option value="">请选择</option>
        <option value="value">.value</option>
        <option value="dot">直接 .prop</option>
      </select>
    </div>

    <div class="q">
      <label>8. useCounter 返回什么给组件？</label>
      <select id="q8">
        <option value="">请选择</option>
        <option value="ref-method">ref + 方法</option>
        <option value="only-number">纯数字</option>
      </select>
    </div>

    <div class="q">
      <label>9. defineStore 属于？</label>
      <select id="q9">
        <option value="">请选择</option>
        <option value="pinia">Pinia</option>
        <option value="composable">composable</option>
      </select>
    </div>

    <div class="q">
      <label>10. composable 与 Pinia 核心区别？</label>
      <select id="q10">
        <option value="">请选择</option>
        <option value="logic">抽逻辑 vs 全局共享</option>
        <option value="same">完全一样</option>
      </select>
    </div>

    <button id="btn-check">验证答案</button>
    <p class="output" id="out"></p>
  </section>

  <script type="module" src="exercise.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第 2 阶段总复盘 · Day 36</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    h1 { font-size: 1.25rem; }
    section { margin: 1.5rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
    .q { margin: 1rem 0; }
    .q label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    select { width: 100%; max-width: 420px; padding: 0.35rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
    .output { margin-top: 1rem; font-weight: 600; min-height: 1.5em; }
    .hint { color: #666; font-size: 0.9rem; }
    code { background: #f0f0f0; padding: 0.1em 0.3em; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>第 2 阶段总复盘 · 闭卷自测（12 题）</h1>
  <p class="hint">覆盖 Day 20–35 Vue 主线。对照 <code>notes/week11-day36-phase2-review.md</code> 口述 8 句。</p>

  <section>
    <div class="q">
      <label>1. script 里读 ref 的值，要？</label>
      <select id="q1">
        <option value="">请选择</option>
        <option value="value">.value</option>
        <option value="direct">直接变量名</option>
      </select>
    </div>

    <div class="q">
      <label>2. 根据已有 state 算派生数据，优先？</label>
      <select id="q2">
        <option value="">请选择</option>
        <option value="computed">computed</option>
        <option value="watch">watch</option>
      </select>
    </div>

    <div class="q">
      <label>3. 监听数据变化去调接口 / 打日志，用？</label>
      <select id="q3">
        <option value="">请选择</option>
        <option value="watch">watch</option>
        <option value="computed">computed</option>
      </select>
    </div>

    <div class="q">
      <label>4. props 数据流方向？</label>
      <select id="q4">
        <option value="">请选择</option>
        <option value="down">父 → 子</option>
        <option value="up">子 → 父</option>
      </select>
    </div>

    <div class="q">
      <label>5. 子组件 v-model 本质是？</label>
      <select id="q5">
        <option value="">请选择</option>
        <option value="prop-emit">modelValue + update:modelValue</option>
        <option value="two-way-ref">父子共享同一个 ref</option>
      </select>
    </div>

    <div class="q">
      <label>6. 登录页跳转前检查 token，常用？</label>
      <select id="q6">
        <option value="">请选择</option>
        <option value="beforeEach">router.beforeEach</option>
        <option value="afterEach">router.afterEach</option>
      </select>
    </div>

    <div class="q">
      <label>7. 路由 /user/:id 取 id？</label>
      <select id="q7">
        <option value="">请选择</option>
        <option value="params">route.params.id</option>
        <option value="query">route.query.id</option>
      </select>
    </div>

    <div class="q">
      <label>8. Pinia 里改 state，推荐在？</label>
      <select id="q8">
        <option value="">请选择</option>
        <option value="actions">actions</option>
        <option value="getters">getters</option>
      </select>
    </div>

    <div class="q">
      <label>9. 跨页面共享登录用户，优先？</label>
      <select id="q9">
        <option value="">请选择</option>
        <option value="pinia">Pinia</option>
        <option value="props">props 逐层传</option>
      </select>
    </div>

    <div class="q">
      <label>10. composable 函数命名惯例？</label>
      <select id="q10">
        <option value="">请选择</option>
        <option value="use">use 开头</option>
        <option value="create">create 开头</option>
      </select>
    </div>

    <div class="q">
      <label>11. composable 与 Pinia 核心区别？</label>
      <select id="q11">
        <option value="">请选择</option>
        <option value="logic">抽逻辑复用 vs 全局共享</option>
        <option value="same">完全一样</option>
      </select>
    </div>

    <div class="q">
      <label>12. Tab 切换保留输入框内容？</label>
      <select id="q12">
        <option value="">请选择</option>
        <option value="keep-alive">keep-alive</option>
        <option value="v-show">只用 v-show</option>
      </select>
    </div>

    <button id="btn-check">验证答案</button>
    <p class="output" id="out"></p>
  </section>

  <script type="module" src="exercise.js"></script>
</body>
</html>

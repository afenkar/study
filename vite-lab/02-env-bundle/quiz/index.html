<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 38 · 环境变量与打包自测</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    h1 { font-size: 1.25rem; }
    section { margin: 1.5rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
    .q { margin: 1rem 0; }
    .q label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    select { width: 100%; max-width: 420px; padding: 0.35rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
    .output { margin-top: 1rem; font-weight: 600; min-height: 1.5em; }
    .hint { color: #666; font-size: 0.9rem; }
    code { background: #f0f0f0; padding: 0.1em 0.3em; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Day 38 · 概念自测（8 题）</h1>
  <p class="hint">对照 <code>notes/week11-day38-env-and-bundle.md</code> 闭卷作答。</p>

  <section>
    <div class="q">
      <label>1. .env.local 应该提交到 git 吗？</label>
      <select id="q1">
        <option value="">请选择</option>
        <option value="no">不提交，每人本地不同</option>
        <option value="yes">必须提交</option>
      </select>
    </div>

    <div class="q">
      <label>2. dev 下和 .env.development 冲突时，谁优先？</label>
      <select id="q2">
        <option value="">请选择</option>
        <option value="dev-local">.env.development.local</option>
        <option value="local">.env.local</option>
      </select>
    </div>

    <div class="q">
      <label>3. 没有 VITE_ 前缀的 DB_PASSWORD 会进浏览器吗？</label>
      <select id="q3">
        <option value="">请选择</option>
        <option value="no">不会</option>
        <option value="yes">会</option>
      </select>
    </div>

    <div class="q">
      <label>4. 改 .env 后 dev 服务器要？</label>
      <select id="q4">
        <option value="">请选择</option>
        <option value="restart">重启 npm run dev</option>
        <option value="nothing">不用管，自动生效</option>
      </select>
    </div>

    <div class="q">
      <label>5. dist/assets 文件名带 hash 主要为了？</label>
      <select id="q5">
        <option value="">请选择</option>
        <option value="cache">内容变则 hash 变，刷新浏览器缓存</option>
        <option value="pretty">好看</option>
      </select>
    </div>

    <div class="q">
      <label>6. 动态 import 的主要好处？</label>
      <select id="q6">
        <option value="">请选择</option>
        <option value="split">按需加载，减小首屏包体积</option>
        <option value="faster-dev">让 dev 启动更快</option>
      </select>
    </div>

    <div class="q">
      <label>7. npm run build 终端显示的 gzip 大小表示？</label>
      <select id="q7">
        <option value="">请选择</option>
        <option value="transfer">压缩后大致传输体积</option>
        <option value="source">源码行数</option>
      </select>
    </div>

    <div class="q">
      <label>8. import.meta.env.PROD 何时为 true？</label>
      <select id="q8">
        <option value="">请选择</option>
        <option value="build">生产 build / preview 时</option>
        <option value="dev">npm run dev 时</option>
      </select>
    </div>

    <button id="btn-check">验证答案</button>
    <p class="output" id="out"></p>
  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
